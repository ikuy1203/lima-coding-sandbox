# コーディングエージェント用サンドボックス VM（Lima テンプレート）
#
#   $ limactl start ./coding-sandbox.yaml
#   $ limactl shell coding-sandbox
#
# - Ubuntu 26.04 LTS
# - ホストのディレクトリは一切マウントしない
# - 基本的なツール（git / gh / build-essential / ripgrep / Python の venv・pipx / Node.js など）をインストールする
# - herdr / Antigravity CLI / GitHub Copilot CLI / Docker Engine を公式手順でインストールする
# - Git のユーザ名・メールアドレス（--param で渡す）と、SSH 鍵によるコミット署名を設定する
# - エージェントは非 root の通常ユーザで実行する（Docker は `sudo docker` で使う）
#
# 詳細は README.md を参照。

# template:_images/ubuntu-26.04 は Lima 2.2.0 から同梱
minimumLimaVersion: 2.2.0

base:
# template:_default/mounts（ホストのホームディレクトリをマウントする設定）は意図的に含めない
- template:_images/ubuntu-26.04

cpus: 4
memory: 8GiB
disk: 100GiB

# Git のユーザ名とメールアドレス（provision/git-config.sh で git config --global に設定する）。
# リポジトリに個人の情報を書かないよう、既定は空にして、作成時に --param で渡す:
#   $ limactl start --param "gitUserName=<名前>" --param "gitUserEmail=<メールアドレス>" ./coding-sandbox.yaml
# make start で作成する場合は、.env に書いた値（無ければホストの git config --global の値）が渡される。
# provision のスクリプトの中では $PARAM_gitUserName / $PARAM_gitUserEmail として参照できる。
param:
  gitUserName: ""
  gitUserEmail: ""

# ホストのディレクトリは一切マウントしない。
# ただし $LIMA_HOME/_config/default.yaml・override.yaml（作成時は base.yaml も）にマウントの設定があると、
# Lima はそれを結合してしまう。その場合は先頭の probe で検出し、起動をエラーにする（README.md を参照）。
mounts: []

# containerd は Docker Engine が管理するため、Lima 同梱の containerd / nerdctl は使わない
containerd:
  system: false
  user: false

ssh:
  # ホストの SSH エージェントや ~/.ssh/*.pub をゲストに渡さない（いずれも Lima の既定値だが明示する）
  forwardAgent: false
  loadDotSSHPubKeys: false

# user は Lima の既定値を使う:
#   ホストと同じ名前・UID の通常ユーザ（非 root）。ホームは /home/<user>.guest、パスワードなしで sudo できる。

# Lima はすべての mode: system を実行してから mode: user を実行する。
# どのスクリプトも起動のたびに実行されるため、冪等に作ってある。
# provision と probes のスクリプトは Go テンプレートとして展開されるため、`{{` を書かないこと。
provision:
- mode: system
  file: provision/base-packages.sh
- mode: system
  file: provision/github-cli.sh
- mode: system
  file: provision/docker-engine.sh
- mode: user
  file: provision/git-config.sh
- mode: user
  file: provision/herdr.sh
- mode: user
  file: provision/antigravity-cli.sh
- mode: user
  file: provision/copilot-cli.sh

# probes は上から順に、ホストから SSH 経由で確認される。
# Lima 2.2.0 では probes の file: がインスタンスの作成時に取り込まれない（provision の file: は取り込まれる）ため、
# スクリプトはここに直接書く。scripts/lint.sh がこれらを取り出して shellcheck で検査する。
probes:
- description: no host directories to be mounted
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # findmnt -t は未知のファイルシステム名を無視して全件を返すことがあるため、/proc/self/mounts を直接調べる
    mounts=$(awk '$3 == "virtiofs" || $3 == "9p" || $3 == "fuse.sshfs"' /proc/self/mounts)
    if [ -n "${mounts}" ]; then
      printf '%s\n' "host directories are mounted in the guest:" "${mounts}" >&2
      exit 1
    fi
  hint: |
    Host directories must not be mounted in this instance. Stop it without using it, and check
    $LIMA_HOME/_config/default.yaml, override.yaml and base.yaml (LIMA_HOME defaults to ~/.lima)
    and the --mount option. See "README.md" for details.
- description: basic tools (git, gh, etc.) to be installed
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # provision/base-packages.sh と provision/github-cli.sh で入れるパッケージの主なコマンド
    for cmd in git curl wget jq less ssh gh gcc make rg fdfind unzip zip tree shellcheck pip3 pipx node npm; do
      # $1 は内側の bash で展開させる
      # shellcheck disable=SC2016
      if ! timeout 30s bash -c 'until command -v "$1" >/dev/null; do sleep 3; done' _ "$cmd"; then
        echo >&2 "$cmd is not installed yet"
        exit 1
      fi
    done
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: herdr, Antigravity CLI and GitHub Copilot CLI to be installed
  script: |
    #!/bin/bash
    set -eu -o pipefail
    for bin in herdr agy copilot; do
      # $1 は内側の bash で展開させる
      # shellcheck disable=SC2016
      if ! timeout 30s bash -c 'until [ -x "$1" ]; do sleep 3; done' _ "$HOME/.local/bin/$bin"; then
        echo >&2 "$bin is not installed yet"
        exit 1
      fi
    done
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: Docker Engine to be running
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # パイプを通さず、docker info の終了ステータスで判定する（デーモンに接続できなければ失敗する）
    if ! timeout 30s bash -c 'until sudo -n docker info >/dev/null 2>&1; do sleep 3; done'; then
      echo >&2 "Docker Engine is not installed or not running yet"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: SSH key for Git commit signing to be created
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # provision/git-config.sh で作る署名用の鍵
    # $1 は内側の bash で展開させる
    # shellcheck disable=SC2016
    if ! timeout 30s bash -c 'until [ -f "$1" ]; do sleep 3; done' _ "$HOME/.ssh/id_ed25519_signing.pub"; then
      echo >&2 "SSH key for Git commit signing is not created yet"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest

message: |
  VM にシェルで入るには:
  ------
  limactl shell {{.Name}}
  ------
  ホストのディレクトリはマウントしていません。ホスト側のプロジェクトで作業するときは、
  VM 内で git clone するか、ホストのプロジェクトディレクトリで次のコマンドを実行してください:
  ------
  limactl shell --sync . {{.Name}}
  ------
  インストール済み:
  - git, gh, gcc / make, rg, fdfind, python3（venv / pip3 / pipx）, node / npm などの基本的なツール
  - herdr, agy (Antigravity CLI), copilot (GitHub Copilot CLI), docker（`sudo docker` で使う）
  コミットは SSH 鍵で署名されます。GitHub で Verified と表示させるには、次の公開鍵を
  https://github.com/settings/ssh/new で「Key type: Signing Key」として登録してください:
  ------
  limactl shell {{.Name}} cat .ssh/id_ed25519_signing.pub
  ------
  初回の認証手順は README.md を参照してください。
