# コーディングエージェント用サンドボックス VM（Lima テンプレート）
#
#   $ limactl start ./coding-sandbox.yaml
#   $ limactl shell coding-sandbox
#
# - Ubuntu 26.04 LTS
# - ホストのディレクトリは一切マウントしない
# - 基本的なツール（git / gh / build-essential / ripgrep / Python の venv・pipx / Node.js など）をインストールする
# - herdr / Antigravity CLI / GitHub Copilot CLI / mise / Docker Engine を公式手順でインストールする
# - Git のユーザ名・メールアドレス（--param で渡す）と、SSH 鍵によるコミット署名を設定する
# - ホストの $TERM の terminfo が VM に無いとき（Ghostty など）は TERM=xterm-256color にする
# - VM の中で再生した音を、ホストのスピーカーから鳴らす（再生のみ。マイクは使えない）
# - エージェントは非 root の通常ユーザで実行する（Docker は sudo なしで使える）
# - ゲストのポートをホストに自動で転送しない（make forward で必要なときだけ転送する）
# - VM から host.lima.internal（ホストの 127.0.0.1）への接続を、VM の中の nftables で遮断する（param で無効にできる）
# - VM の前提をまとめたエージェント向けの指示ファイルを配置できる（既定は無効。param で有効にできる）
#
# 詳細は README.md を参照。

# template:_images/ubuntu-26.04 は Lima 2.2.0 から同梱
minimumLimaVersion: 2.2.0

base:
# template:_default/mounts（ホストのホームディレクトリをマウントする設定）は意図的に含めない
- template:_images/ubuntu-26.04

cpus: 4
memory: 8GiB
disk: 100GiB

# Git のユーザ名とメールアドレス（provision/git-config.sh で git config --global に設定する）。
# リポジトリに個人の情報を書かないよう、既定は空にして、作成時に --param で渡す:
#   $ limactl start --param "gitUserName=<名前>" --param "gitUserEmail=<メールアドレス>" ./coding-sandbox.yaml
# make start で作成する場合は、.env に書いた値（無ければホストの git config --global の値）が渡される。
# provision のスクリプトの中では $PARAM_gitUserName / $PARAM_gitUserEmail として参照できる。
param:
  gitUserName: ""
  gitUserEmail: ""
  # VM（Docker のコンテナを含む）から host.lima.internal（ホストの 127.0.0.1 につながる）への接続を、
  # VM の中の nftables で遮断する（provision/host-loopback-firewall.sh）。"false" にすると遮断しない。
  # make start で作成する場合は .env の BLOCK_HOST_LOOPBACK で指定できる。作成後に変える方法は README.md の「ネットワーク」を参照
  blockHostLoopback: "true"
  # VM の前提（マウントなし、docker ラッパーの制約、mise shims、手動ポート転送など）をまとめた
  # エージェント向けの指示ファイルを配置する（provision/agent-instructions.sh）。既定は配置しない（"false"）。
  # "true" にすると、GitHub Copilot CLI（~/.copilot/copilot-instructions.md）と
  # Antigravity CLI（~/.gemini/config/rules/lima-coding-sandbox.md）に配置する。
  # make start で作成する場合は .env の AGENT_INSTRUCTIONS で指定できる
  agentInstructions: "false"

# ホストのディレクトリは一切マウントしない。
# ただし $LIMA_HOME/_config/default.yaml・override.yaml（作成時は base.yaml も）にマウントの設定があると、
# Lima はそれを結合してしまう。その場合は先頭の probe で検出し、起動をエラーにする（README.md を参照）。
mounts: []

# containerd は Docker Engine が管理するため、Lima 同梱の containerd / nerdctl は使わない
containerd:
  system: false
  user: false

ssh:
  # ホストの SSH エージェントや ~/.ssh/*.pub をゲストに渡さない（いずれも Lima の既定値だが明示する）
  forwardAgent: false
  loadDotSSHPubKeys: false

# ゲストで listen したポートを、ホストの 127.0.0.1 に自動で転送しない（Lima の既定では、127.0.0.1・0.0.0.0 などに bind した
# ポートがすべて転送される）。エージェントが起動したサーバに、ホストのブラウザやツールが意図せず接続しないようにするため
# （ホストで動いていないサービスと同じポートで待ち受けられると、ホストのクライアントが認証情報などを VM に送ってしまう）。
# - guestIP: 0.0.0.0 は、guestIPMustBeZero: false を明示しないと、0.0.0.0 に bind したポートにしか一致しない
#   （127.0.0.1 や ::1 に bind したポートは、Lima の既定のルールで転送されてしまう）
# - ルールは上から順に、最初に一致したものが使われる。$LIMA_HOME/_config/override.yaml のルールはこれより前に、
#   default.yaml のルールはこれより後に置かれる
# - SSH のポートは Lima が別に扱うため、この設定の影響を受けない
# 必要なときは make forward PORT=<ポート> で転送する（README.md の「ネットワーク」を参照）
portForwards:
- guestIP: 0.0.0.0
  guestIPMustBeZero: false
  proto: any
  ignore: true

# VM の中で再生した音を、ホストのスピーカーから鳴らす（Lima では EXPERIMENTAL の機能）。
# vmType は Lima の既定（macOS では vz）を使う。VZ では device: vz を指定すると、
# virtio-sound の再生専用のデバイスが VM に追加される（録音用のデバイスは無い）。
# audio.interface は QEMU 用の設定で、VZ では常に virtio-sound になるため指定しない。
# VM 側の設定（alsa-utils とデバイスのパーミッション）は provision/audio.sh で行う。
audio:
  device: vz

# user は Lima の既定値を使う:
#   ホストと同じ名前・UID の通常ユーザ（非 root）。ホームは /home/<user>.guest、パスワードなしで sudo できる。

# Lima はすべての mode: system を実行してから mode: user を実行する。
# どのスクリプトも起動のたびに実行されるため、冪等に作ってある。
# provision と probes のスクリプトは Go テンプレートとして展開されるため、`{{` を書かないこと。
# apt-get update を 1 回に集約するため、サードパーティの apt リポジトリを登録するスクリプト（github-cli.sh, docker-engine.sh）を先に実行し、
# apt-packages.sh で apt パッケージをまとめてインストールする
provision:
- mode: system
  file: provision/github-cli.sh
- mode: system
  file: provision/docker-engine.sh
- mode: system
  file: provision/apt-packages.sh
- mode: system
  file: provision/host-loopback-firewall.sh
- mode: system
  file: provision/terminfo-fallback.sh
- mode: system
  file: provision/audio.sh
- mode: user
  file: provision/git-config.sh
- mode: user
  file: provision/herdr.sh
- mode: user
  file: provision/antigravity-cli.sh
- mode: user
  file: provision/copilot-cli.sh
- mode: user
  file: provision/mise.sh
- mode: user
  file: provision/agent-instructions.sh

# probes は上から順に、ホストから SSH 経由で確認される。
# Lima 2.2.0 では probes の file: がインスタンスの作成時に取り込まれない（provision の file: は取り込まれる）ため、
# スクリプトはここに直接書く。scripts/lint.sh がこれらを取り出して shellcheck で検査する。
probes:
- description: no host directories to be mounted
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # findmnt -t は未知のファイルシステム名を無視して全件を返すことがあるため、/proc/self/mounts を直接調べる
    mounts=$(awk '$3 == "virtiofs" || $3 == "9p" || $3 == "fuse.sshfs"' /proc/self/mounts)
    if [ -n "${mounts}" ]; then
      printf '%s\n' "host directories are mounted in the guest:" "${mounts}" >&2
      exit 1
    fi
  hint: |
    Host directories must not be mounted in this instance. Stop it without using it, and check
    $LIMA_HOME/_config/default.yaml, override.yaml and base.yaml (LIMA_HOME defaults to ~/.lima)
    and the --mount option. See "README.md" for details.
- description: basic tools (git, gh, etc.) to be installed
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # provision/apt-packages.sh で入れるパッケージ（gh を含む）の主なコマンド
    cmds=(git curl wget jq less ssh gcc make rg fd fdfind unzip zip tree shellcheck nft pip3 pipx node npm)
    check_gh_repo() {
      local repo_list="${GITHUB_CLI_REPO_LIST:-/etc/apt/sources.list.d/github-cli.list}"
      local keyring="${GITHUB_CLI_KEYRING:-/etc/apt/keyrings/githubcli-archive-keyring.gpg}"
      [ -s "${keyring}" ] && [ -s "${repo_list}" ] || return 1
      awk -v key="${keyring}" -v uri="https://cli.github.com/packages" '
        {
          line = $0
          sub(/#.*$/, "", line)
          if (line !~ /^[ \t]*deb([ \t]|$)/) next
          key_ok = 0; uri_ok = 0; suite_ok = 0; comp_ok = 0
          if (match(line, /\[[^]]+\]/)) {
            opts = substr(line, RSTART + 1, RLENGTH - 2)
            rest = substr(line, RSTART + RLENGTH)
            n_opts = split(opts, opt_arr, /[ \t]+/)
            for (i = 1; i <= n_opts; i++) {
              if (opt_arr[i] ~ /^signed-by=/) {
                val = opt_arr[i]
                sub(/^signed-by=/, "", val)
                gsub(/^"|"$/, "", val)
                if (val == key) key_ok = 1
              }
            }
          } else {
            rest = line
            sub(/^[ \t]*deb[ \t]+/, "", rest)
          }
          sub(/^[ \t]+/, "", rest)
          n_rest = split(rest, rest_arr, /[ \t]+/)
          if (n_rest >= 1) {
            entry_uri = rest_arr[1]
            sub(/\/+$/, "", entry_uri)
            target_uri = uri
            sub(/\/+$/, "", target_uri)
            if (entry_uri == target_uri) uri_ok = 1
          }
          if (n_rest >= 2 && rest_arr[2] == "stable") suite_ok = 1
          for (j = 3; j <= n_rest; j++) {
            if (rest_arr[j] == "main") comp_ok = 1
          }
          if (key_ok && uri_ok && suite_ok && comp_ok) {
            found = 1
            exit 0
          }
        }
        END { exit !found }
      ' "${repo_list}" 2>/dev/null
    }
    check_gh() {
      local gh_cmd="${GH_BIN:-/usr/bin/gh}"
      [ -x "${gh_cmd}" ] || return 1
      check_gh_repo || return 1
      # shellcheck disable=SC2016
      [ "$(dpkg-query -W -f='${db:Status-Status}' gh 2>/dev/null)" = installed ] || return 1
      local maintainer
      maintainer=$(dpkg-query -W -f='${Maintainer}' gh 2>/dev/null) || return 1
      [ -n "${maintainer}" ] || return 1
      case "${maintainer}" in
        *"GitHub"*) ;;
        *) return 1 ;;
      esac
      timeout -k 2 5 "${gh_cmd}" --version >/dev/null 2>&1 || return 1
      return 0
    }
    missing() {
      local cmd
      for cmd in "${cmds[@]}"; do
        command -v "$cmd" >/dev/null || printf '%s ' "$cmd"
      done
      check_gh || printf '%s ' "gh"
    }
    gh_status() {
      local gh_cmd="${GH_BIN:-/usr/bin/gh}"
      if [ ! -x "${gh_cmd}" ]; then
        echo "gh (${gh_cmd} not found or not executable)"
        return 0
      fi

      if ! check_gh_repo; then
        echo "gh (official apt repository not configured or invalid)"
        return 0
      fi

      # shellcheck disable=SC2016
      local pkg_status
      pkg_status=$(dpkg-query -W -f='${db:Status-Status}' gh 2>/dev/null || true)
      if [ "${pkg_status}" != "installed" ]; then
        echo "gh (apt package 'gh' is not installed)"
        return 0
      fi

      local maintainer
      if ! maintainer=$(dpkg-query -W -f='${Maintainer}' gh 2>/dev/null) || [ -z "${maintainer}" ]; then
        echo "gh (unable to query package maintainer metadata)"
        return 0
      fi

      case "${maintainer}" in
        *"GitHub"*)
          ;;
        *"Ubuntu Developers"*|*"Debian "*Developers*)
          echo "gh (installed package is from Ubuntu universe instead of official cli.github.com)"
          return 0
          ;;
        *)
          echo "gh (package maintainer '${maintainer}' is not official GitHub)"
          return 0
          ;;
      esac

      if ! timeout -k 2 5 "${gh_cmd}" --version >/dev/null 2>&1; then
        echo "gh ('gh --version' failed or timed out)"
        return 0
      fi

      echo "gh (verification failed)"
    }
    # 全コマンドをまとめて確認し、30 秒以内にそろわなければ、見つからないもの・不整合なものを全件表示して失敗する
    deadline=$((SECONDS + ${PROBE_TIMEOUT:-30}))
    while m=$(missing) && [ -n "$m" ]; do
      if [ "$SECONDS" -ge "$deadline" ]; then
        echo >&2 "the following tools are not installed or failed verification:"
        for item in $m; do
          if [ "$item" = "gh" ]; then
            echo >&2 "  - $(gh_status)"
          else
            echo >&2 "  - $item (command not found)"
          fi
        done
        exit 1
      fi
      sleep "${PROBE_SLEEP:-3}"
    done
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: connections to the host loopback (host.lima.internal) to be blocked
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # provision/host-loopback-firewall.sh で読み込む nftables のテーブルを確認する。
    # param の blockHostLoopback が false のときは遮断しないため、確認しない
    if [ "${PARAM_blockHostLoopback:-true}" = false ]; then
      exit 0
    fi
    if ! timeout 30s bash -c 'until sudo -n nft list table inet lima_coding_sandbox >/dev/null 2>&1; do sleep 3; done'; then
      echo >&2 "nftables rules to block host.lima.internal are not loaded yet"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: herdr, Antigravity CLI, GitHub Copilot CLI and mise to be installed
  script: |
    #!/bin/bash
    set -eu -o pipefail
    bins=(herdr agy copilot mise)
    check_bin() {
      local bin="$1"
      local path="$HOME/.local/bin/$bin"
      [ -x "$path" ] || return 1
      timeout -k 2 5 "$path" --version >/dev/null 2>&1 || return 1
      return 0
    }
    missing() {
      local bin
      for bin in "${bins[@]}"; do
        check_bin "$bin" || printf '%s ' "$bin"
      done
    }
    bin_status() {
      local bin="$1"
      local path="$HOME/.local/bin/$bin"
      if [ ! -e "$path" ] && [ ! -L "$path" ]; then
        echo "$bin (file not found)"
      elif [ ! -x "$path" ]; then
        echo "$bin (file is not executable)"
      else
        local rc=0
        if timeout -k 2 5 "$path" --version >/dev/null 2>&1; then
          rc=0
        else
          rc=$?
        fi
        if [ "$rc" -eq 124 ]; then
          echo "$bin ('$bin --version' timed out after 5s)"
        else
          echo "$bin ('$bin --version' exited with code $rc)"
        fi
      fi
    }
    # 全バイナリをまとめて確認し、30 秒以内にそろわなければ、未導入・検証失敗したものを全件表示して失敗する
    deadline=$((SECONDS + ${PROBE_TIMEOUT:-30}))
    while m=$(missing) && [ -n "$m" ]; do
      if [ "$SECONDS" -ge "$deadline" ]; then
        echo >&2 "the following CLI tools are not installed or failed verification:"
        for bin in $m; do
          echo >&2 "  - $(bin_status "$bin")"
        done
        exit 1
      fi
      sleep "${PROBE_SLEEP:-3}"
    done
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: mise shims to be on PATH in login shells
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # provision/mise.sh が ~/.profile に追記する設定で、ログインシェルの PATH の先頭が mise の shims になることを確認する
    # $1 は内側の bash で、${PATH} はさらにその中のログインシェル（bash -lc）で展開させる
    # shellcheck disable=SC2016
    if ! timeout 30s bash -c '
      check() {
        local first
        first=$(bash -lc "echo \"\${PATH%%:*}\"")
        [ "$first" = "$1" ]
      }
      until check "$1"; do sleep 3; done' _ "$HOME/.local/share/mise/shims"; then
      echo >&2 "mise shims are not at the front of PATH in login shells"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: Docker Engine to be running
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # パイプを通さず、docker info の終了ステータスで判定する（デーモンに接続できなければ失敗する）。
    # /usr/local/bin/docker のラッパーにより、通常ユーザも sudo なしで実行できることを確認する
    if ! timeout 30s bash -c 'until docker info >/dev/null 2>&1; do sleep 3; done'; then
      echo >&2 "Docker Engine is not installed or not running yet"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: audio playback to be available to the user
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # provision/audio.sh で入れる aplay / mpg123 と、udev ルールで通常ユーザに開放する再生デバイスを確認する。
    # 音声が有効か（VM に virtio-sound のデバイスが追加されているか）は、virtio のデバイス ID（0x0019）で判定する。
    # 有効なら、再生デバイスが 1 つ以上あり、すべて書き込めることを必須にする（ドライバの初期化の失敗なども検出する）。
    # audio.device: "" で無効にしたときは virtio-sound のデバイスが無いため、aplay と mpg123 だけを確認する
    # shellcheck disable=SC2016
    if ! timeout 30s bash -c '
      has_virtio_sound() {
        local id
        for id in /sys/bus/virtio/devices/*/device; do
          [ -e "$id" ] && [ "$(cat "$id")" = 0x0019 ] && return 0
        done
        return 1
      }
      ready() {
        command -v aplay >/dev/null && command -v mpg123 >/dev/null || return 1
        has_virtio_sound || return 0
        local dev found=0
        for dev in /dev/snd/pcmC*D*p; do
          # 再生デバイスが無いときは、glob がそのまま残る
          [ -e "$dev" ] || continue
          [ -w "$dev" ] || return 1
          found=1
        done
        [ "$found" = 1 ]
      }
      until ready; do sleep 3; done'; then
      echo >&2 "aplay or mpg123 is not installed yet, or no sound playback device writable by $(id -un) was found"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: Git commit signing to be configured and verified
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # provision/git-config.sh で設定されるコミット署名と鍵の整合性を確認する
    key="$HOME/.ssh/id_ed25519_signing"

    signing_failure_reason=""
    verify_signing() {
      signing_failure_reason=""
      local commit_sign raw_commit_sign get_status get_err gpg_format signing_key default_key_cmd
      get_status=0
      raw_commit_sign=$(git config --includes --global --get commit.gpgsign 2>/dev/null) || get_status=$?
      if [ "${get_status}" -eq 1 ]; then
        commit_sign="false"
      elif [ "${get_status}" -ne 0 ]; then
        get_err=$(git config --includes --global --get commit.gpgsign 2>&1 || true)
        signing_failure_reason="failed to query commit.gpgsign: ${get_err}"
        return 1
      else
        if ! commit_sign=$(git config --includes --global --type=bool --get commit.gpgsign 2>/dev/null); then
          signing_failure_reason="invalid boolean config value for commit.gpgsign: '${raw_commit_sign}'"
          return 1
        fi
      fi
      gpg_format=$(git config --includes --global --get gpg.format 2>/dev/null || true)
      signing_key=$(git config --includes --global --get user.signingkey 2>/dev/null || true)
      signing_key="${signing_key/#\~/$HOME}"
      default_key_cmd=$(git config --includes --global --get gpg.ssh.defaultKeyCommand 2>/dev/null || true)

      # 署名が有効化されていない（未設定、明示的 false/no/0 等）場合は尊重して通過
      if [ "${commit_sign}" != "true" ]; then
        return 0
      fi

      # 独自の署名設定が明示されている場合は尊重して通過
      if [ -n "${default_key_cmd}" ] || [ "${signing_key}" != "${key}" ] || [ "${gpg_format}" != "ssh" ]; then
        return 0
      fi

      # テンプレートの鍵を使う場合、秘密鍵と公開鍵が存在し一致することを確認
      if [ ! -s "${key}" ]; then
        signing_failure_reason="private key ${key} is missing or empty"
        return 1
      fi

      local derived_pub actual_pub
      if ! derived_pub=$(ssh-keygen -y -P '' -f "${key}" 2>&1); then
        case "${derived_pub}" in
          *[Pp]assphrase*|*[Ii]ncorrect*)
            return 0 ;;
          *)
            signing_failure_reason="failed to read private key: ${derived_pub}"
            return 1 ;;
        esac
      fi

      if [ ! -s "${key}.pub" ]; then
        signing_failure_reason="public key ${key}.pub is missing or empty"
        return 1
      fi

      actual_pub=$(awk '{print $1, $2}' "${key}.pub")
      derived_pub=$(echo "${derived_pub}" | awk '{print $1, $2}')
      if [ "${derived_pub}" != "${actual_pub}" ]; then
        signing_failure_reason="public key does not match private key"
        return 1
      fi

      # 一時リポジトリで実際に署名コミットと検証が行えることを確認
      local td
      td=$(mktemp -d)
      local rc=0
      if ! (
        git init -q "${td}"
        local configured_name configured_email
        configured_name=$(git config --includes --global --get user.name 2>/dev/null || true)
        configured_email=$(git config --includes --global --get user.email 2>/dev/null || true)

        if [ -z "${configured_name}" ] || [ -z "${configured_email}" ]; then
          # 未指定時は検証用ローカル設定で署名機構をテスト
          local test_signers="${td}/allowed_signers"
          printf 'diagnostic@example.com namespaces="git" %s\n' "${actual_pub}" > "${test_signers}"
          git -C "${td}" config user.name "Probe User"
          git -C "${td}" config user.email "probe@example.com"
          git -C "${td}" config gpg.format ssh
          git -C "${td}" config user.signingkey "${key}"
          git -C "${td}" config commit.gpgsign true
          git -C "${td}" config gpg.ssh.allowedSignersFile "${test_signers}"
          timeout -k 2 5 git -C "${td}" -c core.hooksPath=/dev/null commit -q --allow-empty --no-verify -m "probe commit" && \
            timeout -k 2 5 git -C "${td}" verify-commit HEAD >/dev/null 2>&1
        else
          timeout -k 2 5 git -C "${td}" -c core.hooksPath=/dev/null commit -q --allow-empty --no-verify -m "probe commit" && \
            timeout -k 2 5 git -C "${td}" verify-commit HEAD >/dev/null 2>&1
        fi
      ); then
        signing_failure_reason="temporary test commit or signature verification failed"
        rc=1
      fi
      rm -rf "${td}"
      return "${rc}"
    }

    deadline=$((SECONDS + ${PROBE_TIMEOUT:-30}))
    until verify_signing; do
      if [ "$SECONDS" -ge "$deadline" ]; then
        if [ -n "${signing_failure_reason}" ]; then
          echo >&2 "Git commit signing verification failed or timed out (${signing_failure_reason})"
        else
          echo >&2 "Git commit signing verification failed or timed out"
        fi
        exit 1
      fi
      sleep "${PROBE_SLEEP:-3}"
    done
  hint: See "/var/log/cloud-init-output.log" in the guest
- description: agent instruction files to be configured
  script: |
    #!/bin/bash
    set -eu -o pipefail
    # provision/agent-instructions.sh で置く指示ファイルを確認する。
    # param の agentInstructions が true でないとき（既定は false）は置かないため、確認しない
    if [ "${PARAM_agentInstructions:-false}" != true ]; then
      exit 0
    fi
    # $1 と $2 は内側の bash で展開させる
    # shellcheck disable=SC2016
    if ! timeout 30s bash -c 'until [ -f "$1" ] && [ -f "$2" ]; do sleep 3; done' _ \
      "$HOME/.copilot/copilot-instructions.md" \
      "$HOME/.gemini/config/rules/lima-coding-sandbox.md"; then
      echo >&2 "agent instruction files are not created yet"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest

message: |
  VM にシェルで入るには:
  ------
  limactl shell {{.Name}}
  ------
  ホストのディレクトリはマウントしていません。ホスト側のプロジェクトで作業するときは、
  VM 内で git clone するか、ホストのプロジェクトディレクトリで次のコマンドを実行してください:
  ------
  limactl shell --sync . {{.Name}}
  ------
  ゲストのポートはホストに自動で転送しません。ホストのブラウザで開くときは、ホストで次のコマンドを実行してください:
  ------
  make forward PORT=<ポート>
  ------
  {{- if ne .Param.blockHostLoopback "false"}}
  VM から host.lima.internal（ホストの 127.0.0.1）への接続は遮断しています（README.md の「ネットワーク」を参照）。
  {{- end}}
  {{- if eq .Param.agentInstructions "true"}}
  エージェント向けの指示ファイル（~/.copilot/copilot-instructions.md、~/.gemini/config/rules/lima-coding-sandbox.md）を配置しています。
  {{- end}}
  インストール済み:
  - git, gh, gcc / make, rg, fd (fdfind), python3（venv / pip3 / pipx）, node / npm などの基本的なツール
  - herdr, agy (Antigravity CLI), copilot (GitHub Copilot CLI), mise, docker
  - aplay, mpg123 など（alsa-utils, mpg123）。VM の中で再生した音はホストのスピーカーから鳴ります
  コミットは SSH 鍵で署名されます。GitHub で Verified と表示させるには、次の公開鍵を
  https://github.com/settings/ssh/new で「Key type: Signing Key」として登録してください:
  ------
  limactl shell {{.Name}} cat .ssh/id_ed25519_signing.pub
  ------
  初回の認証手順は README.md を参照してください。
