name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (Lima ${{ matrix.lima }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # minimum: coding-sandbox.yaml の minimumLimaVersion / latest: Lima の最新リリース
        lima: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lima
        env:
          GH_TOKEN: ${{ github.token }}
          LIMA: ${{ matrix.lima }}
        run: |
          if [ "${LIMA}" = minimum ]; then
            version=$(awk '$1 == "minimumLimaVersion:" { print $2 }' coding-sandbox.yaml)
          else
            version=$(gh release view --repo lima-vm/lima --json tagName --jq .tagName)
            version=${version#v}
          fi
          tarball="lima-${version}-Linux-$(uname -m).tar.gz"
          cd "${RUNNER_TEMP}"
          gh release download "v${version}" --repo lima-vm/lima --pattern "${tarball}" --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          mkdir lima
          tar -C lima -xzf "${tarball}"
          echo "${RUNNER_TEMP}/lima/bin" >>"${GITHUB_PATH}"

      - name: Show versions
        run: |
          limactl --version
          shellcheck --version

      - run: ./scripts/lint.sh
